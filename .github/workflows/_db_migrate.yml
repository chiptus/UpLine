name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "staging or prod"
        required: true
        type: string
    outputs:
      migrate_status:
        description: "Outcome of the migration push step (success/failure)"
        value: ${{ jobs.migrate.outputs.migrate_status }}
      types_status:
        description: "Outcome of the type-regeneration step (success/skipped/failure), staging only"
        value: ${{ jobs.migrate.outputs.types_status }}

permissions:
  contents: write

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'prod' && 'production' || (inputs.target == 'staging' && 'staging' || '') }}
    outputs:
      migrate_status: ${{ steps.outputs.outputs.migrate_status }}
      types_status: ${{ steps.outputs.outputs.types_status }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            staging|prod) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - uses: supabase/setup-cli@v3

      - name: Push migrations
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.target == 'prod' && vars.PROD_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ inputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"

      # Regenerate types from the schema we just pushed, so database.types.ts never
      # drifts from the migrations that landed on staging. Prod isn't migrated per-PR,
      # so this only runs for the staging target.
      - name: Generate types from staging schema
        id: gen-types
        if: inputs.target == 'staging'
        run: ./scripts/gen-types.sh --linked

      - name: Commit and push regenerated types
        id: commit-types
        if: inputs.target == 'staging'
        run: |
          set -euo pipefail
          if git diff --quiet -- src/integrations/supabase/types.ts supabase/functions/_shared/database.types.ts; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/types.ts supabase/functions/_shared/database.types.ts
            git commit -m "chore: regenerate Supabase types from staging schema"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Set job outputs
        id: outputs
        if: always()
        run: |
          echo "migrate_status=${{ steps.push.outcome }}" >> "$GITHUB_OUTPUT"
          echo "types_status=${{ steps.commit-types.outputs.status || 'skipped' }}" >> "$GITHUB_OUTPUT"
