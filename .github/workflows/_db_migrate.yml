name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "staging or prod"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'prod' && 'production' || 'staging' }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            staging|prod) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.target == 'prod' && vars.PROD_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ inputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Reset staging DB (staging only)
        if: inputs.target == 'staging'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [[ "$PROJECT_REF" == "$PROD_PROJECT_REF" ]]; then
            echo "Refusing to reset: STAGING_PROJECT_REF == PROD_PROJECT_REF" >&2
            exit 1
          fi
          echo "Resetting staging DB ($PROJECT_REF) before applying migrations..."
          echo "y" | supabase db reset --linked --password "$DB_PASSWORD"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ inputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: supabase db push --password "$DB_PASSWORD"
