name: _db_migrate

on:
  workflow_call:
    inputs:
      target:
        description: "staging or prod"
        required: true
        type: string
    outputs:
      migrate_status:
        description: "Outcome of the migration push step (success/failure)"
        value: ${{ jobs.migrate.outputs.migrate_status }}
      types_status:
        description: "Outcome of the type-regeneration step (success/skipped/failure), staging only"
        value: ${{ jobs.regenerate-types.outputs.types_status }}

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'prod' && 'production' || (inputs.target == 'staging' && 'staging' || '') }}
    outputs:
      migrate_status: ${{ steps.push.outcome }}

    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target }}" in
            staging|prod) ;;
            *) echo "Invalid target: ${{ inputs.target }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: supabase/setup-cli@v3

      - name: Push migrations
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.target == 'prod' && vars.PROD_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ inputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"

  # Regenerate types from the schema migrate just pushed, so database.types.ts never
  # drifts from the migrations that landed on staging. Prod isn't migrated per-PR, and
  # committing back needs a PR branch to push to, so this only runs for the staging
  # target on a pull_request event, and only once migrations actually pushed. Split
  # into its own job (rather than a step in `migrate`) so only this job needs the
  # `contents: write` permission to push the regenerated-types commit — `migrate`
  # itself never touches the git history and stays read-only.
  regenerate-types:
    name: Regenerate types (${{ inputs.target }})
    needs: migrate
    if: inputs.target == 'staging' && github.event_name == 'pull_request' && needs.migrate.outputs.migrate_status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: write
    outputs:
      types_status: ${{ steps.outcome.outputs.types_status }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v3

      - name: Generate types from staging schema
        id: gen-types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          ./scripts/gen-types.sh --linked

      - name: Commit and push regenerated types
        id: commit-types
        if: steps.gen-types.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet -- src/integrations/supabase/types.ts supabase/functions/_shared/database.types.ts; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/types.ts supabase/functions/_shared/database.types.ts
            git commit -m "chore: regenerate Supabase types from staging schema"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Set job outputs
        id: outcome
        if: always()
        run: |
          if [[ "${{ steps.gen-types.outcome }}" == "failure" || "${{ steps.commit-types.outcome }}" == "failure" ]]; then
            echo "types_status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "types_status=${{ steps.commit-types.outputs.status || 'skipped' }}" >> "$GITHUB_OUTPUT"
          fi
