name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to migrate"
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  pull-requests: write

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.target == 'prod') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target
        id: target
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) TARGET="${{ github.event.inputs.target }}" ;;
            pull_request)      TARGET="staging" ;;
            push)              TARGET="prod" ;;
            *) echo "Unknown event"; exit 1 ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Migrating: $TARGET"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.target == 'prod' && secrets.PROD_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ steps.target.outputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"

      - name: Comment on PR if migration failed
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
          ❌ **DB Migrate failed** — \`$TARGET\` was not updated.

          [View workflow run]($RUN_URL)

          Common causes: a migration that conflicts with the current schema, a dependency on objects that don't exist, or an out-of-order timestamp. Fix the migration and push again to re-run.
          EOF
          )"
