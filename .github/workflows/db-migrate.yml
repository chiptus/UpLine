name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to migrate"
        required: true
        type: choice
        options: [staging, prod]

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.target == 'prod') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="prod"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Migrating: $TARGET"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.target == 'prod' && secrets.PROD_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ steps.target.outputs.target == 'prod' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
