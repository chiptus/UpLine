name: Full Test Suite (Labeled PR)

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

concurrency:
  group: "full-e2e-${{ github.event.pull_request.number }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && 'main' || github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    if: "((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && contains(github.event.pull_request.labels.*.name, 'full-e2e')"
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
      artifact-name: blob-report-${{ matrix.shardIndex }}

  report:
    needs: test
    if: "always() && needs.test.result != 'cancelled' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && contains(github.event.pull_request.labels.*.name, 'full-e2e')"
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: blob-report-*
      post-pr-comment: true

  integration-test:
    if: "((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && contains(github.event.pull_request.labels.*.name, 'full-e2e')"
    uses: ./.github/workflows/integration-run.yml
