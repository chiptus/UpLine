name: E2E Full Suite (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
        # Add shardIndex: [1, 2, 3, 4, 5, 6, 7, 8] and shardTotal: [8] for more shards
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
      artifact-name: blob-report-${{ matrix.shardIndex }}

  report:
    needs: test
    if: always()
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: blob-report-*
      post-pr-comment: false

  notify-failure:
    needs: [test, report]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Report nightly failure as a GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly E2E suite failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The nightly E2E suite failed.\n\nRun: ${runUrl}`;
            const label = "nightly-e2e-failure";

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "d73a4a",
                description: "Nightly E2E full-suite run failed",
              });
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
