name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--project=chromium --retries=2 auth.spec.ts navigation.spec.ts artists.spec.ts voting.spec.ts onboarding.spec.ts"
      artifact-name: smoke-blob-report
      browsers: chromium

  report:
    needs: test
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: smoke-blob-report
      post-pr-comment: true
      report-artifact-name: smoke-playwright-report
