name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    if: "github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'full-e2e')"
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--project=chromium --retries=2 --grep @smoke"
      artifact-name: smoke-blob-report
      browsers: chromium

  report:
    needs: test
    if: always() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'full-e2e'))
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: smoke-blob-report
      post-pr-comment: true
      report-artifact-name: smoke-playwright-report
