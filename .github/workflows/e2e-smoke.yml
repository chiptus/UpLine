name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: "e2e-smoke-${{ github.ref }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && 'main' || github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    if: "((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'full-e2e'))"
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--project=chromium --retries=2 --grep @smoke"
      artifact-name: smoke-blob-report
      browsers: chromium

  report:
    needs: test
    if: "always() && needs.test.result != 'cancelled' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-e2e') && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'full-e2e'))"
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: smoke-blob-report
      post-pr-comment: true
      report-artifact-name: smoke-playwright-report
