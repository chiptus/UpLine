name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
        # Add shardIndex: [1, 2, 3, 4, 5, 6, 7, 8] and shardTotal: [8] for more shards
    uses: ./.github/workflows/e2e-run.yml
    with:
      test-args: "--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
      artifact-name: blob-report-${{ matrix.shardIndex }}

  report:
    needs: test
    if: always()
    uses: ./.github/workflows/e2e-report.yml
    with:
      artifact-pattern: blob-report-*
      post-pr-comment: false

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        run: |
          npx supabase start
          sleep 10
          npx supabase db reset

      - name: Run integration tests
        run: pnpm test:integration
        env:
          TEST_SUPABASE_URL: http://127.0.0.1:54321
          TEST_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

  notify-failure:
    needs: [test, report]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Report nightly failure as a GitHub issue
        uses: actions/github-script@v9
        with:
          script: |
            const script = require('./.github/scripts/notify-nightly-failure.js');
            await script({ github, context });
