<!doctype html>
<html lang="en" data-palette="deep-ocean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/unbounded-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Applies the light theme before first paint to avoid a dark flash; React's ThemeProvider takes over after mount. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var pref =
            stored === "light" || stored === "dark" ? stored : "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref;
          if (resolved === "light") {
            var root = document.documentElement;
            root.setAttribute("data-theme", "light");
          }
        } catch (e) {
          /* default dark */
        }
      })();
    </script>
    <meta name="author" content="UpLine" />

    <title>UpLine</title>
    <meta name="description" content="UpLine - Your Festival companion" />
    <meta property="og:title" content="UpLine" />
    <meta
      property="og:description"
      content="UpLine - Your Festival companion"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/getupline.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/getupline.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
